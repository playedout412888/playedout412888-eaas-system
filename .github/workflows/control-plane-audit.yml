name: Control Plane Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: control-plane-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate control-plane registry
        run: |
          test -f control-plane/README.md
          test -f control-plane/commands.json
          python - <<'PY'
          import json
          with open('control-plane/commands.json', encoding='utf-8') as f:
              data = json.load(f)
          required = {'run ai ops', 'build feature', 'fix', 'deploy', 'daily audit'}
          actual = {x['name'] for x in data['commands']}
          missing = required - actual
          if missing:
              raise SystemExit(f'Missing commands: {sorted(missing)}')
          print(f'Validated {len(actual)} commands')
          PY

      - name: Repository health summary
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          git status --short
  portfolio:
    name: Portfolio type-check and build
    if: ${{ hashFiles('portfolio/package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Production build
        run: npm run build
