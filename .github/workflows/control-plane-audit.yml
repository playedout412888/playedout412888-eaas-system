name: Control Plane Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: control-plane-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate control-plane registry
        run: |
          test -f control-plane/README.md
          test -f control-plane/commands.json
          python - <<'PY'
          import json
          with open('control-plane/commands.json', encoding='utf-8') as f:
              data = json.load(f)
          required = {'run ai ops', 'build feature', 'fix', 'deploy', 'daily audit'}
          actual = {x['name'] for x in data['commands']}
          missing = required - actual
          if missing:
              raise SystemExit(f'Missing commands: {sorted(missing)}')
          print(f'Validated {len(actual)} commands')
          PY

      - name: Run Daily Ops Audit and generate evidence
        id: daily-ops-audit
        run: python control-plane/daily_ops_audit.py

      - name: Upload Daily Ops Audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ops-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/daily-ops-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Repository health summary
        if: always()
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "run_id=${GITHUB_RUN_ID}"
          git status --short