name: Bootstrap Portfolio Lockfile

on:
  push:
    branches:
      - fix/portfolio-lockfile-v2

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund

      - name: Diagnose npm lockfile state
        run: |
          echo "package-lock setting:"
          npm config get package-lock
          echo "files:"
          ls -la
          echo "lockfile:"
          ls -la package-lock.json || true

      - name: Commit lockfile through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          path = "portfolio/package-lock.json"
          with open("package-lock.json", "rb") as f:
              encoded = base64.b64encode(f.read()).decode()
          url = f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          payload = json.dumps({
              "message": "chore(portfolio): add npm lockfile",
              "content": encoded,
              "branch": os.environ["BRANCH"]
          }).encode()
          req = urllib.request.Request(
              url,
              data=payload,
              method="PUT",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req) as resp:
              result = json.load(resp)
          print(result["content"]["path"])
          print(result["commit"]["sha"])
          PY

# API commit verification trigger
