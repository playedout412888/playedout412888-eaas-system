name: Bootstrap Portfolio Lockfile

on:
  push:
    branches:
      - fix/portfolio-lockfile-v2

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund

      - name: Diagnose npm lockfile state
        run: |
          echo "package-lock setting:"
          npm config get package-lock
          echo "files:"
          ls -la
          echo "lockfile:"
          ls -la package-lock.json || true

      - name: Commit lockfile
        run: |
          test -f package-lock.json
          git add -f package-lock.json
          git status --short -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(portfolio): add npm lockfile"
          git push

# repair verification trigger

# force lockfile generation verification
